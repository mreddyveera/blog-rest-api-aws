name: Docker Image build to push to a Registry
'on':
  # pull_request:
  #   branches:
  #     - develop
  #     - main
  push:
    branches:
      - develop
      - main
      - 'feature/**'

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  build_push_dockerimage:
    name: Docker Image and push
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image tag
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Login to DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker image
        id: docker-image
        working-directory: ./api
        run: |
          docker buildx build \
          --load \
          -t ${{ vars.REPO_NAME }}:${{ env.SHORT_SHA }} \
          .

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{vars.REPO_NAME}}:${{ env.SHORT_SHA }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # severity: 'CRITICAL'
          # exit-code: '1'
          # ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: AWS login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: '${{vars.ROLE_ARN}}'
          aws-region: '${{vars.AWS_REGION}}'

      # GitHub Actions requests a short-lived OIDC JWT containing workflow identity claims.
      # AWS STS validates the JWT against the IAM role's trust policy and returns temporary credentials.

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to Registry
        run: |
          docker tag \
            ${{vars.REPO_NAME}}:${{env.SHORT_SHA}} \
            ${{steps.login-ecr.outputs.registry}}/${{vars.REPO_NAME}}:${{env.SHORT_SHA}}

          docker push \
            ${{steps.login-ecr.outputs.registry}}/${{vars.REPO_NAME}}:${{env.SHORT_SHA}}

      


        